name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build test image
        run: docker build -t lior/docker-react -f Dockerfile.dev .

      - name: Run tests
        run: docker run -e CI=true lior/docker-react npm run test
